[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sarvoseda"
version = "0.1.0"
description = "Speech dataset preprocessing (UVR + VAD + DNSMOS) and seed-vc v2 fine-tuning"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24,<2.3",
  "soundfile>=0.12.1",
  "librosa>=0.10.1",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "pyloudnorm>=0.1.1",
  "huggingface_hub>=0.23.0",
  "requests>=2.31",
  "pyarrow>=14.0",
  "silero-vad>=5.1",
  "torch>=2.1",
  "torchaudio>=2.1",
  "audio-separator>=0.28.0",
  "onnxruntime>=1.17",
  "audioread>=3.0",
]

[project.optional-dependencies]
# onnxruntime-gpu must match torch's CUDA MAJOR version or its provider
# library fails to load and it drops to CPU silently. Verified from the
# wheels' own requires_dist:
#   <= 1.26.0 -> nvidia-*-cu12  (CUDA 12)
#   >= 1.27.0 -> nvidia-*-cu13  (CUDA 13)
# Check yours:  python -c "import torch; print(torch.version.cuda)"
cuda12 = ["onnxruntime-gpu>=1.17,<1.27"]
cuda13 = ["onnxruntime-gpu>=1.27"]
train = ["accelerate>=0.30"]
# Only needed for --backend ray, i.e. spreading the CPU stages across
# several machines. On a single server --backend process is equivalent.
ray = ["ray[default]>=2.9"]

[project.scripts]
vcprep = "vcprep.cli:main"
vcft = "seedvc_ft.cli:main"

[tool.setuptools]
packages = ["vcprep", "vcprep.nodes", "vcprep.metrics", "seedvc_ft"]
